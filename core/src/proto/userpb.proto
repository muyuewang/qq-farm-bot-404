syntax = "proto3";

package gamepb.userpb;

import "corepb.proto";
import "avatarframepb.proto";

// ============ 登录请求 ============
message LoginRequest {
    // 字段 1,2 保留未使用
    int64 sharer_id = 3;
    string sharer_open_id = 4;
    DeviceInfo device_info = 5;
    int64 share_cfg_id = 6;
    string scene_id = 7;
    ReportData report_data = 8;
    bytes extra = 9;
}

// 设备信息
message DeviceInfo {
    string client_version = 1;    // e.g. "1.6.0.8_20251224"
    string sys_software = 2;      // e.g. "Windows Unknown x64"
    string sys_hardware = 3;
    string telecom_oper = 4;
    string network = 5;           // e.g. "wifi"
    int64 screen_width = 6;
    int64 screen_height = 7;
    float density = 8;
    string cpu = 9;               // e.g. "microsoft"
    int64 memory = 10;
    string gl_render = 11;
    string gl_version = 12;
    string device_id = 13;
    string android_oaid = 14;
    string ios_caid = 15;
}

// 上报数据
message ReportData {
    string callback = 1;
    string cd_extend_info = 2;
    string click_id = 3;
    string clue_token = 4;
    string minigame_channel = 5;
    int32 minigame_platid = 6;
    string req_id = 7;
    string trackid = 8;
}

message GuideNode {
    int64 node_id = 1;
    int64 status = 2;
    corepb.Item reward = 3;
}

message GuideInfo {
    int64 guide_id = 1;
    repeated GuideNode nodes = 2;
    bool completed = 3;
}

message IllustratedInfo {
    int64 current = 1;
    int64 target = 2;
}

message SystemUnlockItem {
    int64 unlock_type = 1;
}

message MallMsg {
    int64 status = 1;
}

message ActivityWindowStatus {
    int64 activity_id = 1;
    int64 begin_time = 2;
    int64 end_time = 3;
    int64 config_id = 4;
    bool enabled = 5;
}

message PolicyInfo {
    string name = 1;
}

message SceneEffect {
    int64 id = 1;
    string name = 2;
    string effect_name = 3;
    string transition_name = 4;
    bool is_default = 5;
    string begin_time = 6;
    string end_time = 7;
}

message SceneEffectValue {
    int64 value = 1;
}

message SceneEffectSelection {
    int64 effect_type = 1;
    SceneEffectValue value = 2;
}

message SceneEffectConfig {
    repeated SceneEffect effects = 1;
    SceneEffectSelection selection = 2;
}

// ============ 登录回复 ============
message LoginReply {
    BasicInfo basic = 1;
    corepb.ItemBag item_bag = 2;
    int64 time_now_millis = 3;
    bool is_first_login = 4;
    GuideInfo guide_info = 5;
    repeated QQGroupInfo qq_group_infos = 6;
    IllustratedInfo illustrated = 7;
    repeated SystemUnlockItem unlocked_items = 8;
    VersionInfo version_info = 9;
    MallMsg mall_msg = 10;
    int64 qq_friend_recommend_authorized = 11;
    repeated ActivityWindowStatus activity_windows = 12;
    PolicyInfo policy_info = 14;
    int64 field_15 = 15;
    SceneEffectConfig scene_effect_config = 16;
    bytes field_18 = 18;
}

// 用户基本信息
message BasicInfo {
    int64 gid = 1;
    string name = 2;
    int64 level = 3;
    int64 exp = 4;
    int64 gold = 5;
    string open_id = 6;
    string avatar_url = 7;
    string remark = 8;
    string signature = 9;
    int32 gender = 10;
    repeated gamepb.avatarframepb.AvatarFrame equip_avatar_frames = 11;
    map<int64, ShareInfo> share_infos = 12;
    int32 authorized_status = 13;
    bool disable_nudge = 14;
    BasicExtraInfo extra_info = 18;
}

message ShareInfo {
    int64 status = 1;
    int64 count = 2;
}

message BasicExtraInfo {
    string token = 1;
}

// QQ群信息
message QQGroupInfo {
    string qq_group_id = 1;
    string qq_group_name = 2;
}

// 版本信息
message VersionInfo {
    int32 status = 1;
    string version_recommend = 2;
    string version_force = 3;
    string res_version = 4;
}

// ============ 心跳 ============
message HeartbeatRequest {
    int64 gid = 1;
    string client_version = 2;
    int64 field_3 = 3;
}

message HeartbeatReply {
    int64 server_time = 1;
    VersionInfo version_info = 2;
}

// ============ 上报分享点击 ============
// 用于已登录状态下处理分享链接（触发好友申请）
message ReportArkClickRequest {
    int64 sharer_id = 1;
    string sharer_open_id = 2;
    int64 share_cfg_id = 3;
    string scene_id = 4;
}

message ReportArkClickReply {
    // 通常为空响应
}

// ============ 批量上报客户端流程 ============
message BatchClientReportFlowRequest {
    repeated ClientFlowItem items = 1;
}

message ClientFlowItem {
    int32 field_1 = 1;
    int32 field_2 = 2;
    string device_id = 3;
    int64 gid = 4;
    string nickname = 5;
    int64 timestamp = 6;
    int64 level = 7;
    string event_name = 102;
    string action = 108;
    string param_109 = 109;
    string param_110 = 110;
    string param_112 = 112;
}

message BatchClientReportFlowReply {
    int32 accepted_count = 1;
}

// ============ 设置展示信息 ============
message SetDisplayInfoRequest {
    string name = 1;
    string signature = 2;
    int32 gender = 3;
    string avatar_url = 4;
}

message SetDisplayInfoReply {
    BasicInfo basic = 1;
}

// ============ 设置QQ好友推荐授权 ============
message SetQQFriendRecommendAuthorizedRequest {
    int64 authorized = 1;
}

message SetQQFriendRecommendAuthorizedReply {
    int64 authorized = 1;
}

// ============ 获取用户设置 ============
message GetUserSettingsRequest {}

message UserSettings {
    int64 qq_friend_recommend_authorized = 1;
    bool disable_nudge = 2;
    bool field_3 = 3;
}

message GetUserSettingsReply {
    UserSettings settings = 1;
}

// ============ 批量获取用户信息 ============
message BatchGetBasicInfoRequest {
    repeated int64 gids = 1;
}

message BatchGetBasicInfoReply {
    repeated BasicInfo users = 1;
}

// ============ 服务器推送通知 ============

// 基本信息变化通知 (升级/金币变化等)
message BasicNotify {
    BasicInfo basic = 1;
}
