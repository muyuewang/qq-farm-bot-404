syntax = "proto3";

package gamepb.sharepb;

import "corepb.proto";

// ============ 分享服务 ============

// --- 检查是否可以分享 ---
message CheckCanShareRequest {}

message CheckCanShareReply {
    bool can_share = 1;
}

// --- 分享上报（每日礼包：field_1=1/field_4=42；青梅酿：field_1=11/field_4=215） ---
message ReportShareRequest {
    int32 field_1 = 1;
    int32 field_4 = 4;
}

message ReportShareReply {
    bytes result = 1;
}

// --- 分享奖励（抓包确认：field_1=true） ---
message ClaimShareRewardRequest {
    bool field_1 = 1;
}

message ClaimShareRewardReply {
    repeated corepb.Item items = 1;
}

// --- 获取邀请信息 ---
message GetInviteInfoRequest {}

message InviteUser {
    int64 gid = 1;
    int64 field_2 = 2;
    string name = 3;
    string avatar = 4;
}

message InviteRewardStage {
    int64 index = 1;
    int64 reward_index = 2;
    corepb.Item item = 3;
    int32 status = 4;
}

message InviteInfo {
    InviteUser user_a = 1;
    int32 status = 2;
    InviteUser user_b = 3;
    repeated InviteRewardStage reward_stages = 4;
}

message GetInviteInfoReply {
    repeated InviteInfo infos = 1;
}

// --- 领取邀请奖励 ---
message GetInviteAwardRequest {
    int64 share_cfg_id = 1;
}

message GetInviteAwardReply {
    bool success = 1;
    repeated corepb.Item items = 2;
}
