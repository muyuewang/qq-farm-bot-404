syntax = "proto3";

package gamepb.activitypb;

import "corepb.proto";

// Official QQ mini-program 1.14.0.1 (main e802e, 2026-09-10).
// Field numbers/types extracted from the official encoder and verified against captures.

message PetTreasureHuntStoryInfo {
    int32 order = 1;
    bool unlocked = 2;
    bool claimed = 3;
    string selected_desc = 4;
    bool animated = 5;
}

message PetTreasureHuntLogEntry {
    int64 ts = 1;
    repeated corepb.Item costs = 2;
    repeated corepb.Item rewards = 3;
    int32 type = 4;
    int64 dog_id = 5;
    repeated int64 dog_skin_ids = 6;
}

message PetTreasureHuntTreasure {
    string id = 1;
    int64 item_id = 2;
    int64 count = 3;
    int64 created_at = 4;
    int32 status = 5;
    int64 end_at = 6;
    int64 start_at = 7;
    int64 original_count = 8;
    int64 protected_count = 9;
    int64 max_count = 10;
    repeated int32 source_charm_ids = 11;
    repeated PetTreasureHuntBattlePreview battle_previews = 12;
    int64 plunder_count = 13;
    int64 max_plunder_count = 14;
}

message ActivityBodyPetTreasureHunt {
    PetTreasureHuntNurture nurture = 1;
    PetTreasureHuntFeed feed = 2;
    PetTreasureHuntHunt hunt = 3;
    PetTreasureHuntStory story = 4;
    PetTreasureHuntBattle battle = 6;
    PetTreasureHuntPool pool = 7;
    PetTreasureHuntPlunder plunder = 8;
    PetTreasureHuntStreak streak = 9;
}

message PetTreasureHuntNurture {
    bool cg_played = 1;
    int32 guide_step = 2;
    int64 growth = 3;
    int32 stage = 4;
    int64 adult_at = 5;
    bool dog_granted = 6;
}

message PetTreasureHuntFeed {
    int32 feed_count = 1;
}

message PetTreasureHuntHunt {
    int32 treasure_count = 1;
    int64 treasure_total = 2;
    int64 lucky_star_gained_total = 3;
    repeated corepb.Item treasure_cost = 4;
    bool can_play_plunder = 5;
}

message PetTreasureHuntStory {
    repeated PetTreasureHuntStoryInfo stories = 1;
}

message PetTreasureHuntBattle {
    repeated int32 charm_daily_pool = 1;
    repeated int32 charm_equipped = 2;
    int32 battle_count = 3;
    repeated PetTreasureHuntCharmEffectRemaining charm_effect_remaining_count = 4;
    repeated PetTreasureHuntRevengeInfo revenge_marks = 5;
    bool charm_pick_used = 6;
    int64 charm_free_refresh_count = 7;
    int64 charm_paid_refresh_count = 8;
    bool is_skip_battle_cg = 9;
}

message PetTreasureHuntCharmEffectRemaining {
    int32 charm_id = 1;
    int32 effect_order = 2;
    int64 remaining_count = 3;
}

message PetTreasureHuntCharmEffectRef {
    int32 charm_id = 1;
    int32 effect_order = 2;
    int32 owner_side = 3;
}

message PetTreasureHuntCharmTriggeredResult {
}

message PetTreasureHuntCharmRatioChange {
    double before = 1;
    double after = 2;
}

message PetTreasureHuntCharmInt64Change {
    int64 before = 1;
    int64 after = 2;
}

message PetTreasureHuntCharmItemChange {
    corepb.Item before = 1;
    corepb.Item after = 2;
}

message PetTreasureHuntCharmEffectOutput {
    int32 metric = 1;
    PetTreasureHuntCharmTriggeredResult triggered = 10;
    PetTreasureHuntCharmRatioChange ratio_change = 11;
    PetTreasureHuntCharmInt64Change int64_change = 12;
    PetTreasureHuntCharmItemChange item_change = 13;
}

message PetTreasureHuntCharmEffectExecution {
    PetTreasureHuntCharmEffectRef source = 1;
    int32 phase = 2;
    repeated PetTreasureHuntCharmEffectOutput outputs = 3;
}

message PetTreasureHuntCharmRewardSummary {
    corepb.Item before_charms = 1;
    corepb.Item after_charms = 2;
}

message PetTreasureHuntBattleCharmResult {
    repeated int32 attacker_charm_ids = 1;
    repeated int32 defender_charm_ids = 2;
    repeated PetTreasureHuntCharmEffectExecution applied_effects = 3;
    PetTreasureHuntCharmRewardSummary reward_summary = 4;
    PetTreasureHuntCharmRatioChange win_rate_summary = 5;
}

message PetTreasureHuntPool {
    repeated PetTreasureHuntTreasure treasures = 1;
}

message PetTreasureHuntPlunder {
    bool has_unread_plundered_log = 1;
    int64 plunder_compensation_count = 2;
}

message PetTreasureHuntStreak {
    map<int64, int32> losing_streak = 1;
}

message PetTreasureHuntRevengeInfo {
    int64 target_gid = 1;
    int64 expire_at = 2;
    double win_rate_add = 3;
}

message PetTreasureHuntFinishCgReq {
}

message PetTreasureHuntFinishCgRsp {
}

message PetTreasureHuntGuideStepReq {
    int32 target_step = 1;
}

message PetTreasureHuntGuideStepRsp {
    int32 guide_step = 1;
}

message PetTreasureHuntFeedReq {
}

message PetTreasureHuntFeedRsp {
    int64 growth = 1;
    int32 stage = 2;
    bool became_adult = 3;
    int32 feed_count = 4;
    repeated corepb.Item costs = 5;
    int32 times = 6;
    repeated corepb.Item rewards = 7;
}

message PetTreasureHuntDrawReq {
}

message PetTreasureHuntDrawRsp {
    repeated corepb.Item costs = 2;
    int64 treasure_total = 3;
    int32 treasure_count = 4;
    repeated corepb.Item rewards = 5;
    int32 times = 7;
}

message PetTreasureHuntGetLogReq {
}

message PetTreasureHuntGetLogRsp {
    repeated PetTreasureHuntLogEntry logs = 1;
}

message PetTreasureHuntClaimStoryReq {
    int32 order = 1;
}

message PetTreasureHuntClaimStoryRsp {
    repeated corepb.Item awards = 1;
    string desc = 2;
}

message PetTreasureHuntMarkStoryAnimatedReq {
    repeated int32 orders = 1;
}

message PetTreasureHuntMarkStoryAnimatedRsp {
}

message PetTreasureHuntSetSkipBattleCgReq {
    bool skip = 1;
}

message PetTreasureHuntSetSkipBattleCgRsp {
    bool is_skip_battle_cg = 1;
}

message PetTreasureHuntRefreshCharmPoolReq {
}

message PetTreasureHuntRefreshCharmPoolRsp {
    repeated int32 charm_daily_pool = 1;
    int64 refresh_ts = 2;
    repeated corepb.Item costs = 3;
    bool free_refresh = 4;
    int64 free_refresh_count = 5;
    int64 paid_refresh_count = 6;
}

message PetTreasureHuntEquipCharmsReq {
    repeated int32 charm_ids = 1;
}

message PetTreasureHuntEquipCharmsRsp {
    repeated int32 charm_equipped = 1;
}

message PetTreasureHuntOpenTreasureReq {
}

message PetTreasureHuntOpenTreasureRsp {
    repeated corepb.Item rewards = 1;
}

message PetTreasureHuntClaimPlunderCompensationReq {
}

message PetTreasureHuntClaimPlunderCompensationRsp {
    repeated corepb.Item rewards = 1;
}

message PetTreasureHuntGetFriendActivityInfoReq {
    int64 friend_gid = 1;
}

message PetTreasureHuntGetFriendActivityInfoRsp {
    PetTreasureHuntFriendInfo info = 1;
    int64 gid = 2;
}

message PetTreasureHuntFriendInfo {
    repeated PetTreasureHuntTreasure treasures = 1;
    repeated int32 defender_charm_ids = 2;
}

message PetTreasureHuntClaimDogReq {
}

message PetTreasureHuntClaimDogRsp {
    int64 dog_id = 1;
}

message PetTreasureHuntStartBattleReq {
    int64 defender_gid = 1;
    string treasure_id = 2;
    int64 challenge_item_id = 3;
}

message PetTreasureHuntStartBattleRsp {
    bool won = 1;
    corepb.Item plundered = 2;
    string defender_name = 3;
    bool streak_triggered = 4;
    corepb.Item streak_reward = 5;
    repeated corepb.Item rewards = 6;
    int32 attacker_dice = 7;
    int32 defender_dice = 8;
    PetTreasureHuntBattleCharmResult charm_result = 9;
    bool need_refresh = 10;
    bool is_fake = 11;
    string refresh_reason = 12;
}

message PetTreasureHuntGetPlunderedLogReq {
}

message PetTreasureHuntGetPlunderedLogRsp {
    repeated PetTreasureHuntPlunderedLogEntry logs = 1;
}

message PetTreasureHuntPlunderedLogEntry {
    int64 ts = 1;
    int64 attacker_gid = 2;
    string attacker_name = 3;
    repeated corepb.Item lost_items = 4;
    repeated int32 attacker_charm = 5;
    bool attacker_won = 6;
    string treasure_id = 7;
    repeated corepb.Item injected_items = 8;
    int64 challenge_item_id = 9;
    string attacker_avatar = 10;
    int64 attacker_level = 11;
    bool is_fake = 12;
    repeated int32 defender_charm = 13;
}

message PetTreasureHuntBattlePreview {
    string treasure_id = 1;
    int64 challenge_item_id = 2;
    bool can_start = 3;
    corepb.Item max_profit = 4;
    corepb.Item max_loss = 5;
    int64 plunderable_count = 6;
}

message PetDiaryOperateRequest {
    PetDiaryShopBuyReq shop_buy = 101;
    PetTreasureHuntFinishCgReq mega_event_claim_all = 119;
    int64 activity_id = 1;
    int64 operate_type = 2;
    PetTreasureHuntFinishCgReq pet_treasure_hunt_finish_cg = 126;
    PetTreasureHuntGuideStepReq pet_treasure_hunt_guide_step = 127;
    PetTreasureHuntFeedReq pet_treasure_hunt_feed = 128;
    PetTreasureHuntDrawReq pet_treasure_hunt_draw = 129;
    PetTreasureHuntGetLogReq pet_treasure_hunt_get_log = 130;
    PetTreasureHuntClaimStoryReq pet_treasure_hunt_claim_story = 131;
    PetTreasureHuntRefreshCharmPoolReq pet_treasure_hunt_refresh_charm_pool = 141;
    PetTreasureHuntEquipCharmsReq pet_treasure_hunt_equip_charms = 142;
    PetTreasureHuntStartBattleReq pet_treasure_hunt_start_battle = 143;
    PetTreasureHuntGetPlunderedLogReq pet_treasure_hunt_get_plundered_log = 144;
    PetTreasureHuntOpenTreasureReq pet_treasure_hunt_open_treasure = 145;
    PetTreasureHuntClaimPlunderCompensationReq pet_treasure_hunt_claim_plunder_compensation = 146;
    PetTreasureHuntGetFriendActivityInfoReq pet_treasure_hunt_get_friend_activity_info = 147;
    PetTreasureHuntClaimDogReq pet_treasure_hunt_claim_dog = 148;
    PetTreasureHuntMarkStoryAnimatedReq pet_treasure_hunt_mark_story_animated = 149;
    PetTreasureHuntSetSkipBattleCgReq pet_treasure_hunt_set_skip_battle_cg = 150;
}

message PetDiaryActivityHead {
    int64 id = 1;
    int64 group_id = 2;
    int64 type = 3;
    string name = 4;
    string desc = 5;
    int64 start_time = 6;
    int64 end_time = 7;
    int64 client_id = 8;
    int32 status = 20;
    int64 splash_order = 21;
    bool splashed = 22;
    bool has_red_dot = 23;
}

message PetDiaryActivityBodyMegaEvent {
    int64 current_day = 1;
    int64 season_total_days = 2;
    int64 claim_lookback_days = 3;
    repeated PetDiaryMegaEventRewardState rewards = 4;
    repeated PetDiaryMegaEventSegment events = 5;
}

message PetDiaryMegaEventRewardState {
    int64 unlock_day = 1;
    bool unlocked = 2;
    bool claimed = 3;
    bool claimable = 4;
    repeated corepb.Item reward = 5;
}

message PetDiaryMegaEventSegment {
    int64 event_level = 1;
    bool unlocked = 2;
    string event_name = 3;
    string art_path = 4;
    string event_desc = 5;
}

message PetDiaryMegaEventClaimAllRsp {
    repeated int64 newly_claimed_days = 1;
    repeated corepb.Item awards = 2;
}

message PetDiaryShopItemInfo {
    int64 id = 1;
    int64 count = 2;
}

message PetDiaryShopGoodsInfo {
    int64 id = 1;
    repeated PetDiaryShopItemInfo item = 2;
    repeated PetDiaryShopItemInfo cost = 3;
    int64 purchase_limit = 4;
    int64 purchased_count = 5;
    int64 order = 6;
    string name = 7;
    string desc = 8;
    int64 diamond_cost_count = 9;
    int64 background_type = 10;
    int64 restriction_type = 11;
    string category_tag = 12;
}

message PetDiaryActivityBodyShop {
    repeated PetDiaryShopGoodsInfo goods = 1;
}

message PetDiaryShopBuyReq {
    int64 goods_id = 1;
    int64 count = 2;
}

message PetDiaryShopBuyRsp {
    repeated corepb.Item awards = 1;
    repeated corepb.Item costs = 2;
}

message PetDiaryActivityData {
    PetDiaryActivityHead head = 1;
    PetDiaryActivityBodyShop shop = 102;
    PetDiaryActivityBodyMegaEvent mega_event = 110;
    ActivityBodyPetTreasureHunt pet_treasure_hunt = 115;
}
message PetDiaryActivityGroup {
    PetDiaryActivityHead head = 1;
    repeated PetDiaryActivityData children = 2;
}
message PetDiaryGetGroupReply { PetDiaryActivityGroup group = 1; }
message PetDiaryOperateReply {
    int64 activity_id = 1;
    int64 operate_type = 2;
    PetDiaryActivityData data = 3;
    PetDiaryShopBuyRsp shop_buy = 101;
    PetDiaryMegaEventClaimAllRsp mega_event_claim_all = 120;
    PetTreasureHuntFinishCgRsp pet_treasure_hunt_finish_cg = 127;
    PetTreasureHuntGuideStepRsp pet_treasure_hunt_guide_step = 128;
    PetTreasureHuntFeedRsp pet_treasure_hunt_feed = 129;
    PetTreasureHuntDrawRsp pet_treasure_hunt_draw = 130;
    PetTreasureHuntGetLogRsp pet_treasure_hunt_get_log = 131;
    PetTreasureHuntClaimStoryRsp pet_treasure_hunt_claim_story = 132;
    PetTreasureHuntRefreshCharmPoolRsp pet_treasure_hunt_refresh_charm_pool = 141;
    PetTreasureHuntEquipCharmsRsp pet_treasure_hunt_equip_charms = 142;
    PetTreasureHuntStartBattleRsp pet_treasure_hunt_start_battle = 143;
    PetTreasureHuntGetPlunderedLogRsp pet_treasure_hunt_get_plundered_log = 144;
    PetTreasureHuntOpenTreasureRsp pet_treasure_hunt_open_treasure = 145;
    PetTreasureHuntClaimPlunderCompensationRsp pet_treasure_hunt_claim_plunder_compensation = 146;
    PetTreasureHuntGetFriendActivityInfoRsp pet_treasure_hunt_get_friend_activity_info = 147;
    PetTreasureHuntClaimDogRsp pet_treasure_hunt_claim_dog = 148;
    PetTreasureHuntMarkStoryAnimatedRsp pet_treasure_hunt_mark_story_animated = 149;
    PetTreasureHuntSetSkipBattleCgRsp pet_treasure_hunt_set_skip_battle_cg = 150;}
