syntax = "proto3";

package gamepb.dogpb;

import "corepb.proto";

message DogInfo {
    int64 id = 1;
    string name = 2;
    int64 price = 3;
    int32 status = 4;
    int32 level = 5;
    int64 field_6 = 6;
    int32 owned = 7;
}

message GetDogInfoRequest {
    int64 host_gid = 1;
}

message GetDogInfoReply {
    repeated DogInfo dogs = 1;
    int64 current_dog_id = 2;
    int64 protect_time = 3;
    int64 max_protect_time = 4;
    repeated DogFood foods = 5;
    int64 field_6 = 6;
    int64 pending_gift_count = 7;
    repeated DogSkillUsage skill_usages = 8;
}

message DogSkillUsage {
    int64 skill_id = 1;
    int64 used_count = 2;
    int64 daily_limit = 3;
    int64 dog_id = 4;
}

message DeployDogRequest { int64 dog_id = 1; }
message DeployDogReply { int64 dog_id = 1; }
// 活动赠送的宠物仍需在宠物系统激活。2026-09-14 比熊 HAR 证实请求字段 1
// 与 DeployDogRequest 相同，响应字段 1 为激活后的完整 DogInfo。
message ActivateDogRequest { int64 dog_id = 1; }
message ActivateDogReply { DogInfo dog = 1; }
message WithdrawDogRequest {}
message WithdrawDogReply { int64 dog_id = 1; }
message AddFoodRequest { int64 item_id = 1; int64 count = 2; }
message AddFoodReply { int64 protect_time = 1; }

message GetProtectLogsRequest { int64 field_1 = 1; int64 count = 2; int64 field_3 = 3; }
message ProtectLogEntry {
    int64 friend_gid = 1;
    string friend_name = 2;
    string friend_avatar = 3;
    int64 timestamp = 5;
    int64 stolen_count = 6;
    int64 protected_gold = 7;
    int64 dog_id = 8;
    string dog_name = 9;
}
message GetProtectLogsReply { repeated ProtectLogEntry logs = 1; int64 total = 2; }

message ClaimSkillGiftsRequest {}

message ClaimSkillGiftsReply {
    corepb.Item item = 1;
    int64 claimed_count = 3;
}

message PendingGiftCountNotify {
    int64 count = 1;
}

message DogFood {
    int64 id = 1;
    int64 duration = 2;
    int32 status = 3;
}
