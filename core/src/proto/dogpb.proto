syntax = "proto3";

package gamepb.dogpb;

import "corepb.proto";

// ============ 狗狗信息 ============
message DogInfo {
    int64 id = 1;
    string name = 2;
    int64 price = 3;
    // 服务端对所有图鉴项均返回 1，不能据此判断是否已经获得。
    int64 status = 4;
    int64 level = 5;
    // 抓包确认：背包里有同 ID 的宠物卡（道具）时为 1。ActivateDog 消耗卡片后
    // 该项消失，因此它是“可激活”标记，不代表已经获得；获得与否看下面的 owned。
    int64 field_6 = 6;
    // 真实列表与游戏锁定状态逐项比对：1=已获得（可上场）；缺失=未获得或未激活。
    int64 owned = 7;
    // ActivateDog 回包与紧随其后的 GetDogInfo 均为 1，ViewDog 之后消失；
    // 语义尚未完全证明，疑似“新获得未查看”标记，当前不参与业务判断。
    int64 field_10 = 10;
}

// 狗狗装备/道具
message DogItem {
    int64 id = 1;
    int64 duration = 2;
    // 抓包中三种狗粮均固定返回 1，而同一时刻背包只持有其中一种，
    // 因此这是状态位，不是库存；库存必须读取 ItemService.Bag。
    int64 status = 3;
}

// 宠物技能当日使用次数。已与游戏内“今日剩余”逐项核对：
// 同气连枝返回 used_count=7、daily_limit=30，页面显示 23/30。
message DogSkillUsage {
    int64 skill_id = 1;
    int64 used_count = 2;
    int64 daily_limit = 3;
    int64 dog_id = 4;
}

// ============ 请求/回复 ============
message GetDogInfoRequest {
    // 查询好友宠物时使用；查询自己的宠物时保持空请求体。
    int64 host_gid = 1;
}

message GetDogInfoReply {
    repeated DogInfo dogs = 1;
    // 真实抓包：收回后 field 2 消失，重新上场后恢复为宠物 ID。
    int64 current_dog_id = 2;
    int64 protect_time = 3;         // 当前狗粮剩余秒数
    int64 max_protect_time = 4;     // 服务端上限，本次为 2592000（30 天）
    repeated DogItem items = 5;     // 狗狗道具
    // 抓包已确认存在，业务语义尚未证明，当前不用于页面逻辑。
    int64 field_6 = 6;
    // 抓包确认：主人侧尚未拾取的“同气连枝礼包”数量。
    int64 pending_gift_count = 7;
    // 技能当日使用次数；当前已确认技能 2001 为“同气连枝”。
    repeated DogSkillUsage skill_usages = 8;
}

// 宠物页“激活”：消耗背包中的宠物卡，把图鉴项变成可上场的已获得宠物。
// 真实抓包（ActivateDog 前 GetDogInfo 里该宠物只有 field 6，激活后变成 field 7）：
// 请求 { field 1: 90031 }，回包 field 1 是激活后的 DogInfo。
message ActivateDogRequest {
    int64 dog_id = 1;
}

message ActivateDogReply {
    DogInfo dog = 1;
}

message DeployDogRequest {
    int64 dog_id = 1;
}

message DeployDogReply {
    int64 dog_id = 1;
}

message WithdrawDogRequest {}

message WithdrawDogReply {
    int64 dog_id = 1;
}

// 点击宠物页狗盆选择狗粮后，点“确定”调用该接口。
message AddFoodRequest {
    int64 item_id = 1;
    int64 count = 2;
}

message AddFoodReply {
    // 使用后的狗粮剩余秒数。
    int64 protect_time = 1;
}

// 主人点击农场中的礼包堆时发送空请求，服务端一次领取全部待拾取礼包。
message ClaimSkillGiftsRequest {}

message ClaimSkillGiftsReply {
    corepb.Item item = 1;
    int64 claimed_count = 3;
}

message PendingGiftCountNotify {
    int64 count = 1;
}

// 宠物页“守护记录”。请求抓包固定为 { field 1: 0, field 2: 100, field 3: 0 }。
message GetProtectLogsRequest {
    // 字段 1/3 的业务语义尚未证明；仅按真实点击的 0/100/0 发送。
    int64 field_1 = 1;
    int64 count = 2;
    int64 field_3 = 3;
}

// 字段 14 的值会随好友固定重复，更像头像框/铭牌等展示信息；
// 在协议语义确认前仅保留结构用于兼容性审计，不作为守护奖励暴露。
message ProtectLogDisplayItem {
    int64 item_id = 1;
    int64 count = 2;
    int64 field_4 = 4;
}

message ProtectLogExtra {
    bytes value = 1;
}

message ProtectLogEntry {
    int64 friend_gid = 1;
    string friend_name = 2;
    string friend_avatar = 3;
    // Unix 秒级时间戳。
    int64 timestamp = 5;
    // 实际记录中分别对应被扣数量和守护所得金币。
    int64 stolen_count = 6;
    int64 protected_gold = 7;
    int64 dog_id = 8;
    string dog_name = 9;
    int64 friend_role_id = 10;
    int64 field_12 = 12;
    int64 field_13 = 13;
    repeated ProtectLogDisplayItem display_items = 14;
    ProtectLogExtra extra = 20;
}

message GetProtectLogsReply {
    repeated ProtectLogEntry logs = 1;
    int64 total = 2;
}

// 服务端仅推送“记录有更新”的空事件，页面可在用户打开时再拉取完整列表。
message NewProtectLogNotify {}
