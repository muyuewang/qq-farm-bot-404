services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: core/Dockerfile
    image: qq-farm-bot:latest
    container_name: qq-farm-bot
    restart: unless-stopped

    ports:
      - "3007:3007"               # 管理面板
      - "18000:18000"             # 抓包登录 MITM 代理端口（默认关闭，启用后供手机 Wi-Fi 代理连入）

    volumes:
      - ../data:/app/core/data
      - ../data/napcat/auth:/app/napcat-auth:ro

    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      ADMIN_PORT: "3007"
      FARM_DATA_DIR: /app/core/data
      CAPTURE_ADVERTISE_IPS: "${CAPTURE_ADVERTISE_IPS:-auto}"
      NAPCAT_LOGIN_ENABLED: "${NAPCAT_LOGIN_ENABLED:-false}"
      NAPCAT_WEBUI_URL: http://napcat:6099/api
      NAPCAT_OPENAUTH_URL: http://napcat:6099/plugin/qq-miniapp-openauth/api
      # 抓包服务默认关闭；在面板“系统配置 → Code/GID 抓取服务”开启后才会运行。
      # 代理端口固定使用 18000：
      # CAPTURE_PORTS: "18000"
      # 需要固定对外地址时，在 .env 中设置（局域网 / Tailscale 可同时填写）：
      # CAPTURE_ADVERTISE_IPS=192.168.1.100,100.64.0.2

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3007/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  napcat:
    profiles: ["napcat"]
    build:
      context: .
      dockerfile: napcat/Dockerfile
      args:
        NAPCAT_IMAGE: "${NAPCAT_IMAGE:-mlikiowa/napcat-docker:v4.18.19}"
    image: qq-farm-napcat:latest
    container_name: qq-farm-napcat
    hostname: "${NAPCAT_DEVICE_NAME:-QQ-Farm-NapCat}"
    restart: unless-stopped
    # Electron/Chromium 需要较大的 /dev/shm，否则二维码/界面可能白屏或转圈
    shm_size: "1gb"
    environment:
      NAPCAT_UID: "${NAPCAT_UID:-1000}"
      NAPCAT_GID: "${NAPCAT_GID:-1000}"
      # 无 GPU/EGL 的容器里强制软件渲染，避免 GPU 进程退出导致界面/二维码异常
      ELECTRON_DISABLE_GPU: "1"
      ELECTRON_ENABLE_LOGGING: "0"
      LIBGL_ALWAYS_SOFTWARE: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --disable-dev-shm-usage --in-process-gpu"
      ELECTRON_EXTRA_LAUNCH_ARGS: "--no-sandbox --disable-gpu --disable-dev-shm-usage"
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - ../data/napcat/config:/app/napcat/config
      - ../data/napcat/QQ:/app/.config/QQ
      - ../data/napcat/auth:/app/napcat-auth
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
